<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Placeholder para parafusadeira DeWalt -->
  <rect width="400" height="300" fill="#f9fafb"/>

  <!-- Forma simplificada de parafusadeira -->
  <g transform="translate(100, 80)">
    <!-- Corpo principal -->
    <rect x="30" y="50" width="140" height="80" rx="8" fill="#fcd34d" stroke="#374151" stroke-width="2"/>

    <!-- Mandril -->
    <rect x="165" y="75" width="50" height="30" rx="4" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
    <circle cx="215" cy="90" r="12" fill="#4b5563" stroke="#374151" stroke-width="2"/>

    <!-- Gatilho -->
    <path d="M 60 130 Q 45 145 50 160 L 70 160 Q 75 145 70 130 Z" fill="#f59e0b" stroke="#374151" stroke-width="2"/>

    <!-- Bateria -->
    <rect x="20" y="130" width="60" height="75" rx="6" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="30" y="140" width="40" height="12" rx="2" fill="#4b5563"/>
    <text x="50" y="180" font-size="12" fill="#fcd34d" font-weight="bold" text-anchor="middle">20V</text>

    <!-- Detalhes -->
    <circle cx="120" cy="85" r="4" fill="#374151" opacity="0.5"/>
    <line x1="90" y1="90" x2="140" y2="90" stroke="#374151" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- Texto técnico -->
  <text x="200" y="270" font-size="14" fill="#6b7280" text-anchor="middle" font-family="sans-serif">
    Ilustração representativa - não imagem do produto real
  </text>
</svg>
