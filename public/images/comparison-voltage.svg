<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Placeholder para comparação 12V vs 18V -->
  <rect width="400" height="300" fill="#f9fafb"/>

  <!-- Bateria 12V (menor) -->
  <g transform="translate(80, 100)">
    <rect x="0" y="20" width="50" height="80" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="65" font-size="20" fill="#10b981" font-weight="bold" text-anchor="middle" font-family="sans-serif">
      12V
    </text>
    <text x="25" y="130" font-size="12" fill="#6b7280" text-anchor="middle" font-family="sans-serif">
      Compacta
    </text>
  </g>

  <!-- VS -->
  <text x="200" y="155" font-size="20" fill="#6b7280" font-weight="bold" text-anchor="middle" font-family="sans-serif">
    vs
  </text>

  <!-- Bateria 18V (maior) -->
  <g transform="translate(270, 100)">
    <rect x="0" y="0" width="50" height="100" rx="6" fill="#2563eb" opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text x="25" y="55" font-size="20" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="sans-serif">
      18V
    </text>
    <text x="25" y="130" font-size="12" fill="#6b7280" text-anchor="middle" font-family="sans-serif">
      Potente
    </text>
  </g>

  <!-- Texto técnico -->
  <text x="200" y="270" font-size="14" fill="#6b7280" text-anchor="middle" font-family="sans-serif">
    Comparação de categorias de tensão
  </text>
</svg>
